services:
  coffee-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coffee-tracker
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:/data/coffee.db
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    # No published port: the Cloudflare tunnel reaches this container over
    # proxy_net, so nothing needs to listen on the host.
    networks:
      - proxy_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  proxy_net:
    external: true
